name: Nómina y API compartida
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payroll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Cálculos, permisos, correo simulado y API móvil
        run: node --test tests/payroll*.test.mjs
      - run: npm run build
      - name: Guardar compilación para revisar
        uses: actions/upload-artifact@v4
        with:
          name: nomina-server-build
          path: dist/
          retention-days: 7
