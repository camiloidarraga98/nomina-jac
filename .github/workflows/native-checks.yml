name: JAC Apple checks

# One final metadata-only run cancels the old workflow through its concurrency
# group. The job is skipped: no runner starts and no tests or builds run.
on:
  push:
    branches:
      - codex/iphone-media-selection

permissions:
  contents: read

concurrency:
  group: jac-apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stopped:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Apple checks stopped at the user request.'
