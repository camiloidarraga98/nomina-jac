name: JAC Apple checks

on:
  public:
  push:
    branches:
      - main
    paths:
      - ios/**
      - macos/**
      - .github/workflows/native-checks.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run after completing the change
        type: choice
        options: [full, video-upload, video-quality, video-upload-ui, gallery-media, gallery-update, gallery-stability, media-delete, media-light, music, navigation]
        default: full

permissions:
  contents: read

concurrency:
  # An iPhone-only correction must not cancel a reusable Mac build in progress.
  group: jac-apple-${{ github.ref }}${{ contains(github.event.head_commit.message, '[iphone-only]') && '-iphone' || '' }}
  cancel-in-progress: true

jobs:
  iphone:
    # Public standard runners are free; never use the exhausted private quota.
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record Xcode and select a fresh iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ci
          xcodebuild -version | tee native-ci/xcode-version.log
          python3 - <<'PY'
          import json, os, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          for runtime in sorted(devices, key=lambda name: tuple(map(int, re.findall(r'\d+', name))), reverse=True):
              if '.iOS-' not in runtime:
                  continue
              candidates = [device for device in devices[runtime] if device['name'].startswith('iPhone') and device.get('deviceTypeIdentifier')]
              if candidates:
                  device = candidates[0]
                  simulator = subprocess.check_output(['xcrun', 'simctl', 'create', 'JAC CI', device['deviceTypeIdentifier'], runtime], text=True).strip()
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('JAC_CI_SIMULATOR_ID=' + simulator + '\n')
                  break
          else:
              raise SystemExit('No available iPhone simulator runtime was found.')
          PY
      - name: Test the affected iPhone flows
        shell: bash
        env:
          JAC_NAVIGATION_REMAINING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-remaining]') }}
          JAC_NAVIGATION: ${{ inputs.scope == 'navigation' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-navigation]')) }}
          JAC_MUSIC: ${{ inputs.scope == 'music' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-music]')) }}
          JAC_MEDIA_LIGHT: ${{ inputs.scope == 'media-light' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-light]')) }}
          JAC_MEDIA_DELETE: ${{ inputs.scope == 'media-delete' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-delete]')) }}
          JAC_GALLERY_STABILITY: ${{ inputs.scope == 'gallery-stability' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-stability]')) }}
          JAC_GALLERY_STABILITY_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gallery-ui-only]') }}
          JAC_GALLERY_UPDATE: ${{ inputs.scope == 'gallery-update' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-update]')) }}
          JAC_VIDEO_DETAIL_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-detail]') }}
          JAC_HD_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hd-only]') }}
          JAC_GALLERY_ONLY: ${{ inputs.scope == 'gallery-media' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-media]')) }}
          JAC_VIDEO_ONLY: ${{ inputs.scope == 'video-upload' || inputs.scope == 'video-quality' || inputs.scope == 'video-upload-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-upload]')) }}
          JAC_VIDEO_QUALITY_ONLY: ${{ inputs.scope == 'video-quality' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[quality-only]')) }}
          JAC_VIDEO_UI_ONLY: ${{ inputs.scope == 'video-upload-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-upload]') && contains(github.event.head_commit.message, '[ui-only]')) }}
        run: |
          set -euo pipefail
          if [ "$JAC_NAVIGATION" = true ]; then
            checks=(
              -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState
              -only-testing:JACNominaUITests/LaunchTests/testAlexAgendaDatesRemainUsableAfterSwitchingMenusAndBackground
            )
            if [ "$JAC_NAVIGATION_REMAINING" != true ]; then
              checks+=(
                -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarShowsAllModulesAndCanBeDismissed
                -only-testing:JACNominaUITests/LaunchTests/testEmptyProfileCanReachAccountAndLogOutThroughManagement
                -only-testing:JACNominaUITests/LaunchTests/testModernHybridSectionsShowMediaAndItinerariesWithoutFinanceOrBoarding
                -only-testing:JACNominaUITests/LaunchTests/testSidebarAndManagementKeepArchiveTeamAndAccountAccessible
              )
            fi
          elif [ "$JAC_MUSIC" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testMusicPermissionsDoNotGrantOtherSectionsAndUploadsRequireListening
              -only-testing:JACNominaTests/PayrollClientTests/testMusicPlaybackAuthorizationSurvivesLockAndIsRemovedWithSession
              -only-testing:JACNominaTests/PayrollClientTests/testMusicOfflineAudioIsEncryptedRevisionBoundAndCanBeDownloadedAgain
              -only-testing:JACNominaTests/PayrollClientTests/testMusicAlphabeticalSearchAndFileImportPreserveTheSource
              -only-testing:JACNominaTests/PayrollClientTests/testModernSectionsAreExactAndLegacyRestrictionsRemainDefensive
              -only-testing:JACNominaUITests/LaunchTests/testMusicSectionsAndGlobalSearchRespectListeningPermission
              -only-testing:JACNominaUITests/LaunchTests/testMusicSectionSearchAndUploaderControls
            )
          elif [ "$JAC_MEDIA_LIGHT" = true ]; then
            checks=(
              -only-testing:JACNominaTests/MediaGridThumbnailLoaderTests
              -only-testing:JACNominaTests/PayrollClientTests/testThumbnailCacheSurvivesClosingFolderMemoryEvictionAndReopeningSession
              -only-testing:JACNominaTests/PayrollClientTests/testThumbnailDiskCacheIsEncryptedBoundedByRevisionSessionAndExpiry
              -only-testing:JACNominaTests/PayrollClientTests/testLightPhotoPreviewAndAdaptiveVideoNeverRequestOriginalBytes
              -only-testing:JACNominaTests/PayrollClientTests/testThumbnailFailureRemainsAnErrorUntilTheIndexedJPEGIsConfirmed
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryThumbnailUsesOnlyAuthenticatedThumbnailEndpointAndBoundsItsPixels
              -only-testing:JACNominaTests/PayrollClientTests/testMissingThumbnailDoesNotInvalidateOtherImagesOrFolderSession
              -only-testing:JACNominaTests/PayrollClientTests/testMediaStreamingAssetUsesAuthenticatedRangesAndRejectsChangedContent
              -only-testing:JACNominaUITests/LaunchTests/testPhotographyKeepsThumbnailsOrderAndPagesAcrossRefreshAndScrolling
            )
          elif [ "$JAC_MEDIA_DELETE" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testAndersonCanDeleteOnlyWhilePhotographyIsGranted
              -only-testing:JACNominaTests/PayrollClientTests/testAndersonCanDeleteExistingPhotoVideoBatchAndFolder
              -only-testing:JACNominaTests/PayrollClientTests/testPhotographerRoleDoesNotInheritPayrollOrGeneralAccess
              -only-testing:JACNominaTests/PayrollClientTests/testMediaBatchDeletionStopsImmediatelyWhenAuthorizationIsRevoked
            )
          elif [ "$JAC_GALLERY_STABILITY" = true ]; then
            if [ "$JAC_GALLERY_STABILITY_UI_ONLY" = true ]; then
              checks=(-only-testing:JACNominaUITests/LaunchTests/testPhotographyKeepsThumbnailsOrderAndPagesAcrossRefreshAndScrolling)
            else
            checks=(
              -only-testing:JACNominaTests/MediaGridThumbnailLoaderTests
              -only-testing:JACNominaTests/PayrollClientTests/testMissingThumbnailDoesNotInvalidateOtherImagesOrFolderSession
              -only-testing:JACNominaTests/PayrollClientTests/testCacheNotificationsPreserveLoadedPagesAndOrderWhileApplyingExplicitDeletions
              -only-testing:JACNominaTests/PayrollClientTests/testCachedGalleryIncludesDeletionMarkersForVisibleAndPinnedFolders
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryRefreshRestoresAllVisiblePagesBeforeReturningTheReplacement
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryNameTiesMatchServerOrderSoLoadingAnotherPageDoesNotMoveExistingFiles
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryRefreshDoesNotPublishAPartialReplacementWhenALaterPageFails
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryRefreshRejectsRepeatedCursorsAndMixedCollections
              -only-testing:JACNominaTests/PayrollClientTests/testMediaGalleryUsesCreationDateAndKeepsLegacyFoldersAtTheEnd
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryThumbnailUsesOnlyAuthenticatedThumbnailEndpointAndBoundsItsPixels
              -only-testing:JACNominaTests/PayrollClientTests/testMediaFolderPaginationRecursionOfflineReopenAndRevocation
              -only-testing:JACNominaTests/PayrollClientTests/testDeletedPhotoMetadataRemovesOnlyThatCachedItemAndNeverFallsBackOffline
              -only-testing:JACNominaUITests/LaunchTests/testPhotographyKeepsThumbnailsOrderAndPagesAcrossRefreshAndScrolling
              -only-testing:JACNominaUITests/LaunchTests/testVisiblePhotoThumbnailsWakeWhenSlowSessionRestoresOnline
            )
            fi
          elif [ "$JAC_VIDEO_DETAIL_ONLY" = true ]; then
            checks=(-only-testing:JACNominaTests/MediaVideoPreparationTests/testHighResolution60FPSVideoKeepsDetailAndCadenceWithGentlerCompression)
            if [ "$JAC_HD_ONLY" != true ]; then
              checks+=(-only-testing:JACNominaTests/MediaVideoPreparationTests/testHDRVideoIsConvertedToSDRInsteadOfKeepingTheOriginal)
            fi
          elif [ "$JAC_GALLERY_UPDATE" = true ]; then
            checks=(
              -only-testing:JACNominaTests/MediaVideoPreparationTests
              -only-testing:JACNominaTests/MediaUploadQueueTests/testThumbnailRetryKeepsTheLocalFileAndNeverUploadsTheOriginalTwice
              -only-testing:JACNominaTests/PayrollClientTests/testThumbnailFailureRemainsAnErrorUntilTheIndexedJPEGIsConfirmed
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoOnlyFolderPlanTraversesPagesAndSubfoldersWithoutIncludingVideos
              -only-testing:JACNominaTests/PayrollClientTests/testR2FolderDownloadPlanPreservesCollectionForOfflineAndPhotos
              -only-testing:JACNominaTests/PayrollClientTests/testFolderShareClientCreatesListsAndRevokesWithTheSameRequestIdentity
              -only-testing:JACNominaUITests/LaunchTests/testVideoOptimizationCanBeReviewedAndCancelledBeforeUpload
              -only-testing:JACNominaUITests/LaunchTests/testFolderDownloadCanExcludeVideosOrIncludeTheWholeFolder
              -only-testing:JACNominaUITests/LaunchTests/testFolderShareCanBeCreatedAndRevoked
            )
          elif [ "$JAC_GALLERY_ONLY" = true ]; then
            checks=(
              -only-testing:JACNominaTests/MediaVideoPreparationTests
              -only-testing:JACNominaTests/MediaGridThumbnailLoaderTests
              -only-testing:JACNominaTests/MediaUploadQueueTests
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryThumbnailUsesOnlyAuthenticatedThumbnailEndpointAndBoundsItsPixels
              -only-testing:JACNominaUITests/LaunchTests/testVideoOptimizationCanBeReviewedAndCancelledBeforeUpload
              -only-testing:JACNominaUITests/LaunchTests/testExpandedPhotographyFolderScrollsAndKeepsSelectionUsable
              -only-testing:JACNominaUITests/LaunchTests/testPhotoUploadQueueSurvivesLeavingGalleryAndGoingHome
            )
          elif [ "$JAC_VIDEO_UI_ONLY" = true ]; then
            checks=(-only-testing:JACNominaUITests/LaunchTests/testVideoOptimizationCanBeReviewedAndCancelledBeforeUpload)
          elif [ "$JAC_VIDEO_ONLY" = true ]; then
            checks=(
              -only-testing:JACNominaTests/MediaVideoPreparationTests
              -only-testing:JACNominaUITests/LaunchTests/testVideoOptimizationCanBeReviewedAndCancelledBeforeUpload
            )
            if [ "$JAC_VIDEO_QUALITY_ONLY" != true ]; then
              checks+=(-only-testing:JACNominaTests/MediaUploadQueueTests)
            fi
          else
            checks=(
              -only-testing:JACNominaTests
              -only-testing:JACNominaUITests/LaunchTests/testLongPressSelectsMixedMediaAndCancelRestoresThePhotoViewer
              -only-testing:JACNominaUITests/LaunchTests/testSelectedPhotosAndVideosDownloadOnlyThatGroupToPhotosAndOffline
              -only-testing:JACNominaUITests/LaunchTests/testAdministratorCancelsThenDeletesOnlyTheSelectedPhotoAndVideo
            )
          fi
          xcodebuild -project ios/JACNomina.xcodeproj -scheme JACNomina \
            -destination "platform=iOS Simulator,id=$JAC_CI_SIMULATOR_ID" \
            -derivedDataPath native-ci/simulator -resultBundlePath native-ci/iphone.xcresult \
            -parallel-testing-enabled NO \
            "${checks[@]}" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= JAC_PUSH_ENABLED=NO \
            test 2>&1 | tee native-ci/iphone-tests.log
      - name: Verify iPad selection and video deletion using the compiled app
        if: ${{ !cancelled() && (inputs.scope == 'media-light' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-light]'))) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import glob, json, os, re, subprocess
          products = glob.glob('native-ci/simulator/Build/Products/*.xctestrun')
          if not products:
              raise SystemExit('No compiled simulator test bundle to reuse.')
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          for runtime in sorted(devices, key=lambda name:tuple(map(int,re.findall(r'\d+',name))), reverse=True):
              if '.iOS-' not in runtime:
                  continue
              candidates = [d for d in devices[runtime] if d['name'].startswith('iPad') and d.get('deviceTypeIdentifier')]
              if candidates:
                  simulator = subprocess.check_output(['xcrun','simctl','create','JAC iPad CI',candidates[0]['deviceTypeIdentifier'],runtime],text=True).strip()
                  with open(os.environ['GITHUB_ENV'],'a') as output:
                      output.write('JAC_CI_IPAD_SIMULATOR_ID='+simulator+'\n')
                  with open('native-ci/ipad-test-env','w') as output:
                      output.write(simulator+'\n'+products[0]+'\n')
                  break
          else:
              raise SystemExit('No available iPad simulator runtime was found.')
          PYCODE
          JAC_CI_IPAD_SIMULATOR_ID=$(sed -n '1p' native-ci/ipad-test-env)
          JAC_CI_IPAD_XCTESTRUN=$(sed -n '2p' native-ci/ipad-test-env)
          xcodebuild test-without-building -xctestrun "$JAC_CI_IPAD_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$JAC_CI_IPAD_SIMULATOR_ID" \
            -resultBundlePath native-ci/ipad.xcresult -parallel-testing-enabled NO \
            -only-testing:JACNominaUITests/IPadTests/testTabletPhotographyLongPressSelectsAndVideosHaveDeleteAction \
            2>&1 | tee native-ci/ipad-tests.log
      - name: Export compact test diagnostics
        if: always()
        env:
          JAC_NAVIGATION: ${{ inputs.scope == 'navigation' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-navigation]')) }}
        shell: bash
        run: |
          if [ -d native-ci/iphone.xcresult ]; then
            xcrun xcresulttool get test-results summary --path native-ci/iphone.xcresult > native-ci/test-summary.json || true
            if [ "${JAC_NAVIGATION:-false}" = true ]; then
              xcrun xcresulttool export attachments --path native-ci/iphone.xcresult --output-path native-ci/attachments || true
            else
              xcrun xcresulttool export attachments --path native-ci/iphone.xcresult --output-path native-ci/attachments --only-failures || true
            fi
          fi
      - name: Save compact diagnostics separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-Apple-Diagnostics-${{ github.sha }}
          retention-days: 7
          path: |
            native-ci/*.log
            native-ci/*.json
            native-ci/attachments/**/*.png
      - name: Save test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-Apple-${{ github.sha }}
          retention-days: 7
          path: |
            native-ci/*.log
            native-ci/*.xcresult
      - name: Remove the disposable simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${JAC_CI_SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$JAC_CI_SIMULATOR_ID" || true
            xcrun simctl delete "$JAC_CI_SIMULATOR_ID"
          fi
          if [ -n "${JAC_CI_IPAD_SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$JAC_CI_IPAD_SIMULATOR_ID" || true
            xcrun simctl delete "$JAC_CI_IPAD_SIMULATOR_ID"
          fi

  iphone_release:
    if: ${{ github.event.repository.private == false && inputs.scope != 'video-upload' && inputs.scope != 'video-quality' && inputs.scope != 'video-upload-ui' && inputs.scope != 'gallery-media' && inputs.scope != 'gallery-update' && inputs.scope != 'gallery-stability' && inputs.scope != 'media-delete' && inputs.scope != 'media-light' && inputs.scope != 'music' && inputs.scope != 'navigation' && !(github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-video-upload]') || contains(github.event.head_commit.message, '[check-gallery-media]') || contains(github.event.head_commit.message, '[check-gallery-update]') || contains(github.event.head_commit.message, '[check-gallery-stability]') || contains(github.event.head_commit.message, '[check-media-delete]') || contains(github.event.head_commit.message, '[check-media-light]') || contains(github.event.head_commit.message, '[check-music]') || contains(github.event.head_commit.message, '[check-navigation]'))) }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Release for iPhone without a distribution certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ci
          xcodebuild -version | tee native-ci/xcode-version.log
          xcodebuild -project ios/JACNomina.xcodeproj -scheme JACNomina \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath native-ci/device CODE_SIGNING_ALLOWED=NO JAC_PUSH_ENABLED=NO \
            build 2>&1 | tee native-ci/iphone-release.log
      - name: Save Release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-iPhone-Release-${{ github.sha }}
          retention-days: 7
          path: native-ci/*.log

  mac:
    if: ${{ github.event.repository.private == false && inputs.scope != 'video-upload' && inputs.scope != 'video-quality' && inputs.scope != 'video-upload-ui' && inputs.scope != 'navigation' && !(github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-video-upload]') || contains(github.event.head_commit.message, '[iphone-only]'))) }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the Mac app that shares the modified sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ci
          xcodebuild -version | tee native-ci/xcode-version.log
          xcodebuild -project macos/JACMac.xcodeproj -scheme JACMac \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath native-ci/mac CODE_SIGNING_ALLOWED=NO JAC_PUSH_ENABLED=NO \
            build 2>&1 | tee native-ci/mac-release.log
      - name: Save Release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-Mac-Release-${{ github.sha }}
          retention-days: 7
          path: native-ci/*.log
