          # even if an unrelated UI-only marker was accidentally retained.
          if [ "$JAC_SCROLL_WIDGETS_CACHE_FOLLOWUP" = true ] || [ "$JAC_SCROLL_WIDGETS_GALLERY_FOLLOWUP" = true ] || [ "$JAC_SCROLL_WIDGETS_MEMORY_FOLLOWUP" = true ]; then include_render_guards=true; fi
          if [ "$build_action" = test ] && [ "$include_render_guards" = true ]; then
            for guard_test in testWarmFortyBoardingCardsPerformNoMainThreadIOCryptoOrJSON testWarmCalendarAndWorkspaceRenderDoNotReadSessionOrDecode testNoticeBatchPersistsOneIndexAndUnchangedPollDoesNotWriteOrPublish testUnrelatedCacheWritesKeepFortyWarmCardsOffMainThreadIO testGalleryPinPresentationChecksEightyItemsWithoutMainThreadIOAndRejectsRevocation testDecodedGalleryThumbnailsReuseEightyWarmImagesWithoutSessionReadsAndRejectRevocation; do
              guard_check="-only-testing:JACNominaTests/PayrollClientTests/$guard_test"
              already_selected=false
              for selected in ${checks[@]+"${checks[@]}"}; do
                case "$selected" in
                  -only-testing:JACNominaTests|-only-testing:JACNominaTests/PayrollClientTests|"$guard_check") already_selected=true ;;
                esac
              done
              if [ "$already_selected" = false ]; then checks+=("$guard_check"); fi
            done
          fi
          xcodebuild -project ios/JACNomina.xcodeproj -scheme JACNomina \
            -destination "platform=iOS Simulator,id=$JAC_CI_SIMULATOR_ID" \
            -derivedDataPath native-ci/simulator -resultBundlePath native-ci/iphone.xcresult \
            -parallel-testing-enabled NO \
            ${checks[@]+"${checks[@]}"} \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= JAC_PUSH_ENABLED=NO \
            "$build_action" 2>&1 | tee native-ci/iphone-tests.log
      - name: Verify the affected iPad flow using the compiled app
        if: ${{ !cancelled() && (inputs.scope == 'media-light' || inputs.scope == 'photo-notices' || inputs.scope == 'photo-notices-ipad' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-media-light]') || contains(github.event.head_commit.message, '[check-photo-notices]') || contains(github.event.head_commit.message, '[photo-notices-ipad-only]')))) }}
        shell: bash
        env:
          JAC_PHOTO_NOTICES: ${{ inputs.scope == 'photo-notices' || inputs.scope == 'photo-notices-ipad' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-photo-notices]') || contains(github.event.head_commit.message, '[photo-notices-ipad-only]'))) }}
        run: |
          set -euo pipefail
          # `test` can finish without emitting the .xctestrun manifest required
          # by test-without-building. Reuse compiled products to emit it once.
          if ! compgen -G 'native-ci/simulator/Build/Products/*.xctestrun' >/dev/null; then
            xcodebuild -project ios/JACNomina.xcodeproj -scheme JACNomina \
              -destination "platform=iOS Simulator,id=$JAC_CI_SIMULATOR_ID" \
              -derivedDataPath native-ci/simulator \
              -only-testing:JACNominaUITests \
              ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= JAC_PUSH_ENABLED=NO \
              build-for-testing 2>&1 | tee native-ci/ipad-build-for-testing.log
          fi
          python3 - <<'PYCODE'
          import glob, json, os, re, subprocess
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip().split('.')))
          products = glob.glob('native-ci/simulator/Build/Products/*.xctestrun')
          if not products:
              raise SystemExit('No compiled simulator test bundle to reuse.')
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          for runtime in sorted(devices, key=lambda name:tuple(map(int,re.findall(r'\d+',name))), reverse=True):
              if '.iOS-' not in runtime:
                  continue
              if tuple(map(int, re.findall(r'\d+', runtime)))[:2] > sdk[:2]:
                  continue
              candidates = [d for d in devices[runtime] if d['name'].startswith('iPad') and d.get('deviceTypeIdentifier')]
              if candidates:
                  simulator = subprocess.check_output(['xcrun','simctl','create','JAC iPad CI',candidates[0]['deviceTypeIdentifier'],runtime],text=True).strip()
                  with open(os.environ['GITHUB_ENV'],'a') as output:
                      output.write('JAC_CI_IPAD_SIMULATOR_ID='+simulator+'\n')
                  with open('native-ci/ipad-test-env','w') as output:
                      output.write(simulator+'\n'+products[0]+'\n')
                  break
          else:
              raise SystemExit('No available iPad simulator runtime was found.')
          PYCODE
          JAC_CI_IPAD_SIMULATOR_ID=$(sed -n '1p' native-ci/ipad-test-env)
          JAC_CI_IPAD_XCTESTRUN=$(sed -n '2p' native-ci/ipad-test-env)
          if [ "$JAC_PHOTO_NOTICES" = true ]; then
            ipad_check=-only-testing:JACNominaUITests/IPadTests/testTabletMediaFolderNotificationOpensTheExactFolder
          else
            ipad_check=-only-testing:JACNominaUITests/IPadTests/testTabletPhotographyLongPressSelectsAndVideosHaveDeleteAction
          fi
          xcodebuild test-without-building -xctestrun "$JAC_CI_IPAD_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$JAC_CI_IPAD_SIMULATOR_ID" \
            -resultBundlePath native-ci/ipad.xcresult -parallel-testing-enabled NO \
            "$ipad_check" \
            2>&1 | tee native-ci/ipad-tests.log
      - name: Export compact test diagnostics
        if: always()
        env:
          JAC_SCROLL_WIDGETS: ${{ inputs.scope == 'scroll-widgets' || inputs.scope == 'adaptive-photos' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-scroll-widgets]')) }}
          JAC_SLACK_BOARDING: ${{ inputs.scope == 'slack-boarding' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-slack-boarding]')) }}
          JAC_CALENDAR_COMPILE: ${{ inputs.scope == 'calendar-compile' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-calendar-compile]')) }}
          JAC_REDESIGN: ${{ inputs.scope == 'redesign' || inputs.scope == 'redesign-followup' || inputs.scope == 'redesign-forms-ui-only' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-redesign]') || contains(github.event.head_commit.message, '[redesign-followup]') || contains(github.event.head_commit.message, '[redesign-forms-ui-only]'))) }}
          JAC_BOARDING_CARD: ${{ inputs.scope == 'boarding-card' || inputs.scope == 'boarding-card-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-boarding-card]')) }}
          JAC_WIDE_WORKSPACE: ${{ inputs.scope == 'wide-workspace' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-wide-workspace]')) }}
          JAC_NAVIGATION: ${{ inputs.scope == 'navigation' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-navigation]')) }}
        shell: bash
        run: |
          if [ -d native-ci/iphone.xcresult ]; then
            xcrun xcresulttool get test-results summary --path native-ci/iphone.xcresult > native-ci/test-summary.json || true
            if [ "${JAC_SCROLL_WIDGETS:-false}" = true ]; then
              xcrun xcresulttool get test-results metrics --path native-ci/iphone.xcresult > native-ci/test-metrics.json || true
            fi
            if [ "${JAC_WIDE_WORKSPACE:-false}" = true ] || [ "${JAC_SCROLL_WIDGETS:-false}" = true ] || [ "${JAC_SLACK_BOARDING:-false}" = true ] || [ "${JAC_CALENDAR_COMPILE:-false}" = true ] || [ "${JAC_REDESIGN:-false}" = true ] || [ "${JAC_NAVIGATION:-false}" = true ] || [ "${JAC_BOARDING_CARD:-false}" = true ]; then
              xcrun xcresulttool export attachments --path native-ci/iphone.xcresult --output-path native-ci/attachments || true
            else
              xcrun xcresulttool export attachments --path native-ci/iphone.xcresult --output-path native-ci/attachments --only-failures || true
            fi
          fi
          if [ -d native-ci/ipad.xcresult ]; then
            xcrun xcresulttool get test-results summary --path native-ci/ipad.xcresult > native-ci/ipad-test-summary.json || true
            xcrun xcresulttool export attachments --path native-ci/ipad.xcresult --output-path native-ci/ipad-attachments || true
          fi
      - name: Save compact diagnostics separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-Apple-Diagnostics-${{ github.sha }}
          retention-days: 7
          path: |
            native-ci/*.log
            native-ci/*.json
            native-ci/attachments/**/*.png
            native-ci/attachments/**/*.txt
            native-ci/attachments/**/*.json
            native-ci/ipad-attachments/**/*.png
            native-ci/ipad-attachments/**/*.txt
            native-ci/ipad-attachments/**/*.json
      - name: Save test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-Apple-${{ github.sha }}
          retention-days: 7
          path: |
            native-ci/*.log
            native-ci/*.xcresult
      - name: Remove the disposable simulator
        if: always()
        shell: bash
        run: |
          if [ -n "${JAC_CI_SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$JAC_CI_SIMULATOR_ID" || true
            xcrun simctl delete "$JAC_CI_SIMULATOR_ID"
          fi
          if [ -n "${JAC_CI_IPAD_SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$JAC_CI_IPAD_SIMULATOR_ID" || true
            xcrun simctl delete "$JAC_CI_IPAD_SIMULATOR_ID"
          fi

  iphone_release:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-media-tests-only]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-media-ui-only]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[adaptive-photos-diagnostics]')) && github.event.repository.private == false && ((github.event_name == 'push' && (contains(github.event.head_commit.message, '[scroll-widgets-cache-followup]') || contains(github.event.head_commit.message, '[scroll-widgets-gallery-followup]') || contains(github.event.head_commit.message, '[scroll-widgets-memory-followup]'))) || (!(github.event_name == 'push' && contains(github.event.head_commit.message, '[scroll-widgets-ui-only]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[slack-boarding-ui-only]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[calendar-ui-only]')) && inputs.scope != 'redesign-forms-ui-only' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-forms-ui-only]')) && inputs.scope != 'photo-notices-ipad' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[photo-notices-ipad-only]')) && inputs.scope != 'video-upload' && inputs.scope != 'video-quality' && inputs.scope != 'video-upload-ui' && inputs.scope != 'gallery-media' && inputs.scope != 'gallery-update' && inputs.scope != 'gallery-stability' && inputs.scope != 'gallery-prefetch' && inputs.scope != 'media-delete' && inputs.scope != 'media-light' && inputs.scope != 'music' && inputs.scope != 'navigation' && inputs.scope != 'layout' && inputs.scope != 'boarding-card' && inputs.scope != 'boarding-card-ui' && inputs.scope != 'audit' && inputs.scope != 'photo-preview' && inputs.scope != 'apple-push-ui' && inputs.scope != 'wallet-details-ui' && !(github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-video-upload]') || contains(github.event.head_commit.message, '[check-gallery-media]') || contains(github.event.head_commit.message, '[check-gallery-update]') || contains(github.event.head_commit.message, '[check-gallery-stability]') || contains(github.event.head_commit.message, '[check-gallery-prefetch]') || contains(github.event.head_commit.message, '[check-media-delete]') || contains(github.event.head_commit.message, '[check-media-light]') || contains(github.event.head_commit.message, '[check-music]') || contains(github.event.head_commit.message, '[check-navigation]') || contains(github.event.head_commit.message, '[check-layout]') || contains(github.event.head_commit.message, '[check-boarding-card]') || contains(github.event.head_commit.message, '[check-audit]') || contains(github.event.head_commit.message, '[check-photo-preview]') || contains(github.event.head_commit.message, '[push-ui-only]') || (contains(github.event.head_commit.message, '[wallet-ui-only]') && !contains(github.event.head_commit.message, '[wallet-ui-product]')))))) }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record installed Xcodes and select the latest for the focused compiler check
        shell: bash
        env:
          JAC_LATEST_XCODE: ${{ inputs.scope == 'wide-workspace' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-wide-workspace]')) || inputs.scope == 'photo-filmstrip' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-photo-filmstrip]')) || inputs.scope == 'media-native-actions' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-native-media-actions]')) || inputs.scope == 'calendar-compile' || inputs.scope == 'slack-boarding' || inputs.scope == 'scroll-widgets' || inputs.scope == 'adaptive-photos' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-calendar-compile]') || contains(github.event.head_commit.message, '[check-slack-boarding]') || contains(github.event.head_commit.message, '[check-scroll-widgets]') || contains(github.event.head_commit.message, '[check-adaptive-photos]'))) }}
        run: |
          set -euo pipefail
          mkdir -p native-ci
          python3 - <<'PYCODE' | tee native-ci/xcode-selection.log
          import glob, os, pathlib, re, subprocess
          candidates = []
          for app in sorted(glob.glob('/Applications/Xcode*.app')):
              developer = str(pathlib.Path(app) / 'Contents/Developer')
              if not pathlib.Path(developer).is_dir():
                  continue
              result = subprocess.run(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(app + '\n' + result.stdout.strip())
              version = re.search(r'^Xcode (\d+(?:\.\d+)*)', result.stdout, re.MULTILINE)
              build = re.search(r'^Build version (.+)$', result.stdout, re.MULTILINE)
              if result.returncode == 0 and version:
                  parts = tuple(map(int, version.group(1).split('.')))
                  candidates.append((parts + (0,) * (4 - len(parts)), build.group(1) if build else '', developer))
          if os.environ['JAC_LATEST_XCODE'] == 'true':
              if not candidates:
                  raise SystemExit('No installed Xcode was found for the focused compiler check.')
              developer = max(candidates)[2]
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('DEVELOPER_DIR=' + developer + '\n')
              os.environ['DEVELOPER_DIR'] = developer
              print('Focused compiler check selected: ' + developer)
          else:
              print('Preserving the runner default Xcode for this scope.')
          subprocess.run(['xcodebuild', '-version'], check=True)
          subprocess.run(['xcrun', 'swift', '--version'], check=True)
          PYCODE
      - name: Build Release for iPhone without a distribution certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ci
          xcodebuild -version | tee native-ci/xcode-version.log
          xcodebuild -project ios/JACNomina.xcodeproj -scheme JACNomina \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath native-ci/device CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee native-ci/iphone-release.log
      - name: Verify orientations and document configuration in the compiled iOS bundle
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, pathlib, plistlib
          path = pathlib.Path('native-ci/device/Build/Products/Release-iphoneos/JACNomina.app/Info.plist')
          with path.open('rb') as source:
              info = plistlib.load(source)
          required = {'UIInterfaceOrientationPortrait', 'UIInterfaceOrientationPortraitUpsideDown', 'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'}
          orientations = info.get('UISupportedInterfaceOrientations', [])
          ipad = info.get('UISupportedInterfaceOrientations~ipad', orientations)
          assert info.get('CFBundleIdentifier') == 'co.jacmusic.nomina', 'Unexpected application bundle'
          assert 2 in info.get('UIDeviceFamily', []), 'iPad support must remain enabled'
          assert required.issubset(orientations), 'The generated orientations must support iPad multitasking'
          assert required.issubset(ipad), 'The effective iPad orientations must support multitasking'
          assert info.get('CFBundleDocumentTypes'), 'Audio import document types must remain present'
          assert info.get('LSSupportsOpeningDocumentsInPlace') is True, 'Document opening must be declared as boolean YES'
          result = {'bundle': info['CFBundleIdentifier'], 'version': info.get('CFBundleShortVersionString'), 'build': info.get('CFBundleVersion'), 'orientations': orientations, 'ipadOrientations': ipad, 'opensDocumentsInPlace': info['LSSupportsOpeningDocumentsInPlace']}
          pathlib.Path('native-ci/bundle-config.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PYCODE
      - name: Verify the embedded WidgetKit extension and shared-group configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, pathlib, plistlib, re, subprocess
          repository = pathlib.Path.cwd()
          app = repository / 'native-ci/device/Build/Products/Release-iphoneos/JACNomina.app'
          widget = app / 'PlugIns/JACWidgets.appex'
          def read_plist(path):
              with path.open('rb') as source:
                  return plistlib.load(source)
          app_info, widget_info = read_plist(app / 'Info.plist'), read_plist(widget / 'Info.plist')
          app_id, widget_id = 'co.jacmusic.nomina', 'co.jacmusic.nomina.widgets'
          group, team = 'group.co.jacmusic.nomina.widgets', 'AYHVYN8BJF'
          assert app_info.get('CFBundleIdentifier') == app_id, 'Unexpected app bundle for the widget'
          assert widget_info.get('CFBundleIdentifier') == widget_id, 'The WidgetKit extension must be embedded under the expected bundle ID'
          assert widget_info.get('NSExtension', {}).get('NSExtensionPointIdentifier') == 'com.apple.widgetkit-extension', 'The embedded product must be a WidgetKit extension'
          for key in ['CFBundleVersion', 'CFBundleShortVersionString']:
              assert widget_info.get(key) == app_info.get(key), 'App and widget versions must match: ' + key
          def settings(target):
              command = ['xcodebuild', '-project', 'ios/JACNomina.xcodeproj', '-target', target, '-configuration', 'Release', '-sdk', 'iphoneos', '-showBuildSettings', '-json', 'CODE_SIGNING_ALLOWED=NO']
              records = json.loads(subprocess.check_output(command, text=True))
              return next(record['buildSettings'] for record in records if record.get('target') == target)
          evidence = {}
          for target, bundle_id in [('JACNomina', app_id), ('JACWidgets', widget_id)]:
              build = settings(target)
              assert build.get('DEVELOPMENT_TEAM') == team, 'App and widget must preserve the same configured Apple team'
              assert build.get('PRODUCT_BUNDLE_IDENTIFIER') == bundle_id, 'Unexpected effective target bundle identifier'
              assert str(build.get('CURRENT_PROJECT_VERSION')) == str(app_info['CFBundleVersion']), 'Effective build number must match the embedded product'
              assert build.get('MARKETING_VERSION') == app_info['CFBundleShortVersionString'], 'Effective marketing version must match the embedded product'
              entitlements = build.get('CODE_SIGN_ENTITLEMENTS', '').strip('"')
              assert entitlements, 'An explicit shared-group entitlement file is required'
              root = pathlib.Path(build['SRCROOT'])
              for variable in ['$(SRCROOT)', '${SRCROOT}', '$(PROJECT_DIR)', '${PROJECT_DIR}']:
                  entitlements = entitlements.replace(variable, str(root))
              source = pathlib.Path(entitlements)
              if not source.is_absolute():
                  source = root / source
              values = read_plist(source)
              assert group in values.get('com.apple.security.application-groups', []), 'Both targets must declare the same widget App Group'
              evidence[target] = {'bundle': bundle_id, 'team': build['DEVELOPMENT_TEAM'], 'entitlementSource': str(source.relative_to(repository)), 'appGroups': values['com.apple.security.application-groups']}
          # Unsigned Release builds may not emit .xcent files. Verify generated
          # entitlements when present and always inspect the effective source.
          xcent_files = []
          for path in (repository / 'native-ci/device').rglob('*.xcent'):
              if path.name not in ['JACNomina.app.xcent', 'JACWidgets.appex.xcent']:
                  continue
              values = read_plist(path)
              assert group in values.get('com.apple.security.application-groups', []), 'Generated app/widget entitlements must retain the shared group'
              generated_team = values.get('com.apple.developer.team-identifier')
              if generated_team is not None:
                  assert generated_team == team, 'Unexpected generated signing-team metadata'
              xcent_files.append(str(path.relative_to(repository)))
          widget_source = (repository / 'ios/JACWidgets/JACWidgets.swift').read_text()
          declarations = re.findall(r'\.supportedFamilies\(\s*\[([^]]+)\]\s*\)', widget_source)
          required_families = {'systemSmall', 'systemMedium', 'systemLarge'}
          assert any(set(re.findall(r'\.(systemSmall|systemMedium|systemLarge)\b', declaration)) == required_families for declaration in declarations), 'The configurable widget must support small, medium and large families'
          result = {'app': app_id, 'widget': widget_id, 'version': app_info['CFBundleShortVersionString'], 'build': app_info['CFBundleVersion'], 'familiesDeclared': sorted(required_families), 'targets': evidence, 'generatedEntitlementFiles': xcent_files, 'signingPerformed': False}
          pathlib.Path('native-ci/widget-config.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PYCODE
      - name: Save Release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAC-iPhone-Release-${{ github.sha }}
          retention-days: 7
          path: |
            native-ci/*.log
            native-ci/bundle-config.json
            native-ci/widget-config.json

