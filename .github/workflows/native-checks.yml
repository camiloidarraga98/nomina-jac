name: JAC Apple checks

on:
  public:
  push:
    branches:
      - main
    paths:
      - ios/**
      - macos/**
      - .github/workflows/native-checks.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run after completing the change
        type: choice
        options: [wide-workspace, photo-filmstrip, media-native-actions, full, calendar-compile, slack-boarding, scroll-widgets, adaptive-photos, redesign, redesign-followup, redesign-forms-ui-only, video-upload, video-quality, video-upload-ui, gallery-media, gallery-update, gallery-stability, gallery-prefetch, media-delete, media-light, music, navigation, layout, audit, photo-preview, photo-notices, photo-notices-ipad, apple-push, apple-push-ui, apple-wallet, wallet-details, wallet-details-ui, boarding-card, boarding-card-ui, ios-bundle]
        default: full

permissions:
  contents: read

concurrency:
  # An iPhone-only correction must not cancel a reusable Mac build in progress.
  group: jac-apple-${{ github.ref }}${{ contains(github.event.head_commit.message, '[check-wide-workspace]') && '-wide' || '' }}${{ contains(github.event.head_commit.message, '[iphone-only]') && '-iphone' || '' }}
  cancel-in-progress: true

jobs:
  iphone:
    # Public standard runners are free; never use the exhausted private quota.
    if: ${{ github.event.repository.private == false && inputs.scope != 'ios-bundle' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[check-ios-bundle]')) }}
    runs-on: macos-15
    timeout-minutes: ${{ (inputs.scope == 'wide-workspace' || contains(github.event.head_commit.message, '[check-wide-workspace]')) && 40 || (inputs.scope == 'scroll-widgets' || contains(github.event.head_commit.message, '[check-scroll-widgets]')) && 35 || 25 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record installed Xcodes and select the latest for the focused compiler check
        shell: bash
        env:
          JAC_LATEST_XCODE: ${{ inputs.scope == 'wide-workspace' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-wide-workspace]')) || inputs.scope == 'photo-filmstrip' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-photo-filmstrip]')) || inputs.scope == 'media-native-actions' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-native-media-actions]')) || inputs.scope == 'calendar-compile' || inputs.scope == 'slack-boarding' || inputs.scope == 'scroll-widgets' || inputs.scope == 'adaptive-photos' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-calendar-compile]') || contains(github.event.head_commit.message, '[check-slack-boarding]') || contains(github.event.head_commit.message, '[check-scroll-widgets]') || contains(github.event.head_commit.message, '[check-adaptive-photos]'))) }}
        run: |
          set -euo pipefail
          mkdir -p native-ci
          python3 - <<'PYCODE' | tee native-ci/xcode-selection.log
          import glob, os, pathlib, re, subprocess
          candidates = []
          for app in sorted(glob.glob('/Applications/Xcode*.app')):
              developer = str(pathlib.Path(app) / 'Contents/Developer')
              if not pathlib.Path(developer).is_dir():
                  continue
              result = subprocess.run(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(app + '\n' + result.stdout.strip())
              version = re.search(r'^Xcode (\d+(?:\.\d+)*)', result.stdout, re.MULTILINE)
              build = re.search(r'^Build version (.+)$', result.stdout, re.MULTILINE)
              if result.returncode == 0 and version:
                  parts = tuple(map(int, version.group(1).split('.')))
                  candidates.append((parts + (0,) * (4 - len(parts)), build.group(1) if build else '', developer))
          if os.environ['JAC_LATEST_XCODE'] == 'true':
              if not candidates:
                  raise SystemExit('No installed Xcode was found for the focused compiler check.')
              developer = max(candidates)[2]
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('DEVELOPER_DIR=' + developer + '\n')
              os.environ['DEVELOPER_DIR'] = developer
              print('Focused compiler check selected: ' + developer)
          else:
              print('Preserving the runner default Xcode for this scope.')
          subprocess.run(['xcodebuild', '-version'], check=True)
          subprocess.run(['xcrun', 'swift', '--version'], check=True)
          PYCODE
      - name: Record Xcode and select a fresh iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ci
          # Headless CI must present the software keyboard when a real field
          # receives focus; tests still require that keyboard and typed values.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          defaults read com.apple.iphonesimulator ConnectHardwareKeyboard > native-ci/simulator-hardware-keyboard.log
          xcodebuild -version | tee native-ci/xcode-version.log
          python3 - <<'PY'
          import json, os, re, subprocess
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip().split('.')))
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          for runtime in sorted(devices, key=lambda name: tuple(map(int, re.findall(r'\d+', name))), reverse=True):
              if '.iOS-' not in runtime:
                  continue
              if tuple(map(int, re.findall(r'\d+', runtime)))[:2] > sdk[:2]:
                  continue
              candidates = [device for device in devices[runtime] if device['name'].startswith('iPhone') and device.get('deviceTypeIdentifier')]
              if candidates:
                  device = candidates[0]
                  simulator = subprocess.check_output(['xcrun', 'simctl', 'create', 'JAC CI', device['deviceTypeIdentifier'], runtime], text=True).strip()
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('JAC_CI_SIMULATOR_ID=' + simulator + '\n')
                  break
          else:
              raise SystemExit('No iPhone simulator runtime compatible with the selected Xcode SDK was found.')
          PY
      - name: Build and check the affected iPhone flows
        shell: bash
        env:
          JAC_SCROLL_WIDGETS: ${{ inputs.scope == 'scroll-widgets' || inputs.scope == 'adaptive-photos' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-scroll-widgets]')) }}
          JAC_SCROLL_WIDGETS_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[scroll-widgets-ui-only]') }}
          JAC_SCROLL_WIDGETS_CACHE_FOLLOWUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[scroll-widgets-cache-followup]') }}
          JAC_SCROLL_WIDGETS_GALLERY_FOLLOWUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[scroll-widgets-gallery-followup]') }}
          JAC_SCROLL_WIDGETS_MEMORY_FOLLOWUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[scroll-widgets-memory-followup]') }}
          JAC_CALENDAR_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[calendar-ui-only]') }}
          JAC_SLACK_BOARDING: ${{ inputs.scope == 'slack-boarding' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-slack-boarding]')) }}
          JAC_SLACK_BOARDING_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[slack-boarding-ui-only]') }}
          JAC_CALENDAR_COMPILE: ${{ inputs.scope == 'calendar-compile' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-calendar-compile]')) }}
          JAC_REDESIGN: ${{ inputs.scope == 'redesign' || inputs.scope == 'redesign-followup' || inputs.scope == 'redesign-forms-ui-only' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-redesign]') || contains(github.event.head_commit.message, '[redesign-followup]') || contains(github.event.head_commit.message, '[redesign-forms-ui-only]'))) }}
          JAC_REDESIGN_FORMS_UI_ONLY: ${{ inputs.scope == 'redesign-forms-ui-only' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-forms-ui-only]')) }}
          JAC_REDESIGN_CRM_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-crm-only]') }}
          JAC_REDESIGN_FOLLOWUP: ${{ inputs.scope == 'redesign-followup' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-followup]')) }}
          JAC_WALLET_DETAILS: ${{ inputs.scope == 'wallet-details' || inputs.scope == 'wallet-details-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-wallet-details]')) }}
          JAC_WALLET_DETAILS_UI_ONLY: ${{ inputs.scope == 'wallet-details-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[wallet-ui-only]')) }}
          JAC_BOARDING_CARD: ${{ inputs.scope == 'boarding-card' || inputs.scope == 'boarding-card-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-boarding-card]')) }}
          JAC_BOARDING_CARD_UI_ONLY: ${{ inputs.scope == 'boarding-card-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[boarding-card-ui-only]')) }}
          JAC_APPLE_WALLET: ${{ inputs.scope == 'apple-wallet' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-apple-wallet]')) }}
          JAC_APPLE_PUSH: ${{ inputs.scope == 'apple-push' || inputs.scope == 'apple-push-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-apple-push]')) }}
          JAC_APPLE_PUSH_UI_ONLY: ${{ inputs.scope == 'apple-push-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[push-ui-only]')) }}
          JAC_ADAPTIVE_PHOTOS_DIAGNOSTICS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[adaptive-photos-diagnostics]') }}
          JAC_ADAPTIVE_PHOTOS_FOLLOWUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[adaptive-photos-cache-followup]') }}
          JAC_ADAPTIVE_PHOTOS: ${{ inputs.scope == 'adaptive-photos' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-adaptive-photos]')) }}
          JAC_PHOTO_PREVIEW: ${{ inputs.scope == 'photo-preview' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-photo-preview]')) }}
          JAC_PHOTO_NOTICES: ${{ inputs.scope == 'photo-notices' || inputs.scope == 'photo-notices-ipad' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-photo-notices]') || contains(github.event.head_commit.message, '[photo-notices-ipad-only]'))) }}
          JAC_PHOTO_NOTICES_IPAD_ONLY: ${{ inputs.scope == 'photo-notices-ipad' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[photo-notices-ipad-only]')) }}
          JAC_AUDIT: ${{ inputs.scope == 'audit' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-audit]')) }}
          JAC_LAYOUT_ONLY: ${{ inputs.scope == 'layout' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-layout]')) }}
          JAC_NAVIGATION_DRAWER_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-drawer-only]') }}
          JAC_NAVIGATION_STATE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-state-only]') }}
          JAC_NAVIGATION_AGENDA_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-agenda-only]') }}
          JAC_NAVIGATION_REMAINING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-remaining]') }}
          JAC_NAVIGATION: ${{ inputs.scope == 'navigation' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-navigation]')) }}
          JAC_MUSIC: ${{ inputs.scope == 'music' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-music]')) }}
          JAC_GALLERY_PREFETCH: ${{ inputs.scope == 'gallery-prefetch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-prefetch]')) }}
          JAC_GALLERY_PREFETCH_REMAINING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[prefetch-remaining]') }}
          JAC_MEDIA_LIGHT: ${{ inputs.scope == 'media-light' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-light]')) }}
          JAC_MEDIA_DELETE: ${{ inputs.scope == 'media-delete' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-delete]')) }}
          JAC_GALLERY_STABILITY: ${{ inputs.scope == 'gallery-stability' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-stability]')) }}
          JAC_GALLERY_STABILITY_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gallery-ui-only]') }}
          JAC_GALLERY_UPDATE: ${{ inputs.scope == 'gallery-update' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-update]')) }}
          JAC_VIDEO_DETAIL_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-detail]') }}
          JAC_HD_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hd-only]') }}
          JAC_GALLERY_ONLY: ${{ inputs.scope == 'gallery-media' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-media]')) }}
          JAC_WIDE_WORKSPACE: ${{ inputs.scope == 'wide-workspace' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-wide-workspace]')) }}
          JAC_PHOTO_FILMSTRIP: ${{ inputs.scope == 'photo-filmstrip' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-photo-filmstrip]')) }}
          JAC_NATIVE_MEDIA_ACTIONS: ${{ inputs.scope == 'media-native-actions' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-native-media-actions]')) }}
          JAC_NATIVE_MEDIA_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[native-media-ui-only]') }}
          JAC_VIDEO_ONLY: ${{ inputs.scope == 'video-upload' || inputs.scope == 'video-quality' || inputs.scope == 'video-upload-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-upload]')) }}
          JAC_VIDEO_QUALITY_ONLY: ${{ inputs.scope == 'video-quality' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[quality-only]')) }}
          JAC_VIDEO_UI_ONLY: ${{ inputs.scope == 'video-upload-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-upload]') && contains(github.event.head_commit.message, '[ui-only]')) }}
        run: |
          set -euo pipefail
          build_action=test
          if [ "$JAC_WIDE_WORKSPACE" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testWideWorkspaceNeedsUsableColumnsAndRespectsAccessibilityText
              -only-testing:JACNominaTests/PayrollClientTests/testOpenNoticeDocumentStampRejectsOtherAttachmentsNewRevisionAndLogout
              -only-testing:JACNominaTests/PayrollClientTests/testItinerariesUseAuthenticatedAPIAndProtectedTemporaryPDF
              -only-testing:JACNominaTests/PayrollClientTests/testManualItineraryAttachmentsArePrivateAndDeletionIsIdempotent
              -only-testing:JACNominaTests/MediaPhotoFilmstripTests
              -only-testing:JACNominaTests/MediaFullscreenPhotoModelTests
              -only-testing:JACNominaUITests/LaunchTests/testWideAgendaKeepsSelectionWhenRotating
              -only-testing:JACNominaUITests/LaunchTests/testWideMusicKeepsPlaylistAndPlaybackAcrossSections
              -only-testing:JACNominaUITests/LaunchTests/testWidePhotographyKeepsGridBesidePhotoAndCanExpand
              -only-testing:JACNominaUITests/LaunchTests/testWideBoardingKeepsCardsAndOriginalPDFTogether
              -only-testing:JACNominaUITests/LaunchTests/testWideCRMShowsListAndSelectedShowDetails
              -only-testing:JACNominaUITests/LaunchTests/testItineraryOpensPDFDirectlyAndKeepsDocumentWhileRotating
              -only-testing:JACNominaUITests/LaunchTests/testReaderCanOpenItineraryAndHasNoCreateAlertButton
              -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarShowsAllModulesAndCanBeDismissed
              -only-testing:JACNominaUITests/LaunchTests/testExplicitReceiptAndUpdatedItineraryRequireNewConfirmation
            )
          elif [ "$JAC_PHOTO_FILMSTRIP" = true ]; then
            checks=(
              -only-testing:JACNominaTests/MediaPhotoFilmstripTests
              -only-testing:JACNominaTests/MediaFullscreenPhotoModelTests
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoDataBridgeReportsMeasuredHalfBeforeCompletingAndRejectsOversize
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoDataBridgeCancellationStopsPendingProgressAndLateCompletion
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoPreviewQueueSharesMeasuredProgressAndWithdrawsCancelledAndRevokedReaders
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoPreviewQueueSharesReadersReservesCapacityAndPrioritizesVisibleRequests
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoPreviewQueueRejectsRevokedLateResultsAndConnectionPolicyAvoidsBulkOnLowData
              -only-testing:JACNominaTests/PayrollClientTests/testPendingPhotoPreviewRetriesOnlyTheLightVersionAndKeepsItsSession
              -only-testing:JACNominaTests/PayrollClientTests/testDownloadedFolderPhotosOpenLocallyWhileOnlineAndOfflineWithoutAnyRequest
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoPreviewCacheReopensAcrossClientsImprovesOnceAndNeverFallsBackAfterDenial
              -only-testing:JACNominaTests/PayrollClientTests/testLightPhotoPreviewAndAdaptiveVideoNeverRequestOriginalBytes
              -only-testing:JACNominaTests/PayrollClientTests/testForbiddenPhotoPreviewNeverRetriesOrFallsBackToAnOriginal
              -only-testing:JACNominaUITests/LaunchTests/testPhotoFilmstripScrubsBothWaysAndStaysSyncedWithPagerAfterReopening
              -only-testing:JACNominaUITests/LaunchTests/testPhotoFilmstripFastScrubbingKeepsTheSelectedThumbnailAndPhotoTogether
              -only-testing:JACNominaUITests/LaunchTests/testPhotoViewerHasFolderFilmstripDirectSaveAndBothVerticalDismissGestures
              -only-testing:JACNominaUITests/LaunchTests/testFullscreenPhotoChangesImmediatelyShowsProgressAndReusesViewedCache
            )
          elif [ "$JAC_NATIVE_MEDIA_ACTIONS" = true ]; then
            checks=(
              -only-testing:JACNominaUITests/LaunchTests/testOriginalVideoCanBeReviewedAndCancelledBeforeUpload
              -only-testing:JACNominaUITests/LaunchTests/testPhotoViewerHasFolderFilmstripDirectSaveAndBothVerticalDismissGestures
              -only-testing:JACNominaUITests/LaunchTests/testFolderCanCollapseDuringDownloadAndRemoveOnlyItsLocalCopy
              -only-testing:JACNominaUITests/LaunchTests/testSelectedPhotosAndVideosDownloadOnlyThatGroupToPhotosAndOffline
              -only-testing:JACNominaUITests/LaunchTests/testFullscreenPhotoChangesImmediatelyShowsProgressAndReusesViewedCache
            )
            if [ "$JAC_NATIVE_MEDIA_UI_ONLY" != true ]; then
              checks+=(
                -only-testing:JACNominaTests/MediaVideoPreparationTests
                -only-testing:JACNominaTests/MediaUploadQueueTests
                -only-testing:JACNominaTests/MediaFullscreenPhotoModelTests
                -only-testing:JACNominaTests/PayrollClientTests/testLocalFolderRemovalKeepsServerGalleryAndAllowsDownloadingAgain
                -only-testing:JACNominaTests/PayrollClientTests/testLocalFolderRemovalIsRecursiveAndPreservesOtherFoldersAndSessions
                -only-testing:JACNominaTests/PayrollClientTests/testDirectPhotoSaveWritesTheOriginalAndCleansItsTemporaryFile
                -only-testing:JACNominaTests/PayrollClientTests/testDirectPhotoSaveStopsAfterDeniedPermissionOrSessionChange
                -only-testing:JACNominaTests/PayrollClientTests/testBulkPhotoExportStopsIfSessionChangesWhilePhotosPermissionIsPending
                -only-testing:JACNominaTests/PayrollClientTests/testDeniedPhotosPermissionReportsAnActionableResultWithoutDownloading
              )
            fi
          elif [ "$JAC_SCROLL_WIDGETS" = true ]; then
            checks=(
              -only-testing:JACNominaUITests/ScrollPerformanceTests/testWarmPhotoAndBoardingListsKeepResponsiveScrolling
              -only-testing:JACNominaUITests/ScrollPerformanceTests/testHiddenSectionsSuspendPollingAndPrefetchWhileSidebarScrolls
            )
            if [ "$JAC_SCROLL_WIDGETS_UI_ONLY" != true ] || [ "$JAC_SCROLL_WIDGETS_CACHE_FOLLOWUP" = true ]; then
              # A cache-source followup reuses only the two legacy navigation
              # UI after their unchanged inputs passed. WidgetSnapshot reruns
              # with its separate physical-device protection check.
              if [ "$JAC_SCROLL_WIDGETS_CACHE_FOLLOWUP" != true ]; then
                checks+=(
                  -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState
                  -only-testing:JACNominaUITests/LaunchTests/testAlexAgendaDatesRemainUsableAfterSwitchingMenusAndBackground
                )
              fi
              checks+=(
                -only-testing:JACNominaTests/WidgetSnapshotTests
                -only-testing:JACNominaTests/PayrollClientTests/testWarmFortyBoardingCardsPerformNoMainThreadIOCryptoOrJSON
                -only-testing:JACNominaTests/PayrollClientTests/testUnrelatedCacheWritesKeepFortyWarmCardsOffMainThreadIO
                -only-testing:JACNominaTests/PayrollClientTests/testSessionProtectionFailureClassificationDoesNotHideRevocation
                -only-testing:JACNominaTests/PayrollClientTests/testGalleryPinPresentationChecksEightyItemsWithoutMainThreadIOAndRejectsRevocation
                -only-testing:JACNominaTests/PayrollClientTests/testDecodedGalleryThumbnailsReuseEightyWarmImagesWithoutSessionReadsAndRejectRevocation
                -only-testing:JACNominaTests/PayrollClientTests/testNoticeBatchPersistsOneIndexAndUnchangedPollDoesNotWriteOrPublish
                -only-testing:JACNominaTests/PayrollClientTests/testOfflineBatchRejectsLateWritesAfterRevocationAndRemainsReadableOnRelaunch
                -only-testing:JACNominaTests/PayrollClientTests/testWarmCalendarAndWorkspaceRenderDoNotReadSessionOrDecode
                -only-testing:JACNominaTests/PayrollClientTests/testPendingNoticePersistenceCannotReturnAfterLogout
                -only-testing:JACNominaTests/PayrollClientTests/testNoticeFeedDenialInvalidatesWarmCanonicalCards
                -only-testing:JACNominaTests/PayrollClientTests/testOlderWorkspaceResponseCannotReplaceWarmNewerWorkspace
                -only-testing:JACNominaTests/PayrollClientTests/testConcurrentAgendaPersistenceMergesMonthsAndRejectsOlderPendingUpdate
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataCachesEachFileAndBoundsConcurrentReads
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataRevocationAndNewRevisionNeverRestoreOldValues
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataDiscardsLateExtractionAfterLogout
                -only-testing:JACNominaTests/PayrollClientTests/testRejectedWorkspaceSaveCannotRestoreRevokedRoleOrOldAgendaIdentity
                -only-testing:JACNominaTests/PayrollClientTests/testRevalidationRevocationPurgesFullCacheRatherThanUsingFallback
                -only-testing:JACNominaTests/PayrollClientTests/testFullOfflineCopyIsEncryptedSessionBoundAndRejectsTampering
                -only-testing:JACNominaTests/PayrollClientTests/testRevokedAgendaSessionAndForbiddenCalendarPurgeOfflineCopy
                -only-testing:JACNominaTests/PayrollClientTests/testAgendaCacheDropsOldCalendarAndCannotRollbackConnectionOrRetainDisconnectedEvents
                -only-testing:JACNominaTests/PayrollClientTests/testMusicPlaybackAuthorizationSurvivesLockAndIsRemovedWithSession
                -only-testing:JACNominaTests/PayrollClientTests/testMusicOfflineAudioIsEncryptedRevisionBoundAndCanBeDownloadedAgain
              )
            fi
          elif [ "$JAC_SLACK_BOARDING" = true ]; then
            checks=(-only-testing:JACNominaUITests/LaunchTests/testBoardingCardShowsFlightDetailsBeforeOpeningTheOriginal)
            if [ "$JAC_SLACK_BOARDING_UI_ONLY" != true ]; then
              checks+=(
                -only-testing:JACNominaTests/BoardingWalletDetailsTests
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataCachesEachFileAndBoundsConcurrentReads
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataRevocationAndNewRevisionNeverRestoreOldValues
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataDiscardsLateExtractionAfterLogout
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMessageMetadataDoesNotDownloadOriginalAndRevalidatesChanges
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMessageMetadataKeepsPartialFieldsWhenExtractionFails
              )
            fi
          elif [ "$JAC_CALENDAR_COMPILE" = true ]; then
            checks=(
              -only-testing:JACNominaUITests/LaunchTests/testAgendaMonthUpcomingDetailsAndAccountRemainAccessible
              -only-testing:JACNominaUITests/LaunchTests/testAgendaDayEdgesSelectTheWholeVisibleCell
            )
          elif [ "$JAC_LAYOUT_ONLY" = true ]; then
            checks=()
            build_action=build-for-testing
