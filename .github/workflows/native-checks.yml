name: JAC Apple checks

on:
  public:
  push:
    branches:
      - main
    paths:
      - ios/**
      - macos/**
      - .github/workflows/native-checks.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run after completing the change
        type: choice
        options: [full, calendar-compile, redesign, redesign-followup, redesign-forms-ui-only, video-upload, video-quality, video-upload-ui, gallery-media, gallery-update, gallery-stability, gallery-prefetch, media-delete, media-light, music, navigation, layout, audit, photo-preview, photo-notices, photo-notices-ipad, apple-push, apple-push-ui, apple-wallet, wallet-details, wallet-details-ui, boarding-card, boarding-card-ui, ios-bundle]
        default: full

permissions:
  contents: read

concurrency:
  # An iPhone-only correction must not cancel a reusable Mac build in progress.
  group: jac-apple-${{ github.ref }}${{ contains(github.event.head_commit.message, '[iphone-only]') && '-iphone' || '' }}
  cancel-in-progress: true

jobs:
  iphone:
    # Public standard runners are free; never use the exhausted private quota.
    if: ${{ github.event.repository.private == false && inputs.scope != 'ios-bundle' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[check-ios-bundle]')) }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record installed Xcodes and select the latest for the Calendar compiler check
        shell: bash
        env:
          JAC_CALENDAR_COMPILE: ${{ inputs.scope == 'calendar-compile' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-calendar-compile]')) }}
        run: |
          set -euo pipefail
          mkdir -p native-ci
          python3 - <<'PYCODE' | tee native-ci/xcode-selection.log
          import glob, os, pathlib, re, subprocess
          candidates = []
          for app in sorted(glob.glob('/Applications/Xcode*.app')):
              developer = str(pathlib.Path(app) / 'Contents/Developer')
              if not pathlib.Path(developer).is_dir():
                  continue
              result = subprocess.run(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': developer}, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(app + '\n' + result.stdout.strip())
              version = re.search(r'^Xcode (\d+(?:\.\d+)*)', result.stdout, re.MULTILINE)
              build = re.search(r'^Build version (.+)$', result.stdout, re.MULTILINE)
              if result.returncode == 0 and version:
                  parts = tuple(map(int, version.group(1).split('.')))
                  candidates.append((parts + (0,) * (4 - len(parts)), build.group(1) if build else '', developer))
          if os.environ['JAC_CALENDAR_COMPILE'] == 'true':
              if not candidates:
                  raise SystemExit('No installed Xcode was found for the Calendar compiler check.')
              developer = max(candidates)[2]
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('DEVELOPER_DIR=' + developer + '\n')
              os.environ['DEVELOPER_DIR'] = developer
              print('Calendar compiler check selected: ' + developer)
          else:
              print('Preserving the runner default Xcode for this scope.')
          subprocess.run(['xcodebuild', '-version'], check=True)
          subprocess.run(['xcrun', 'swift', '--version'], check=True)
          PYCODE
      - name: Record Xcode and select a fresh iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ci
          # Headless CI must present the software keyboard when a real field
          # receives focus; tests still require that keyboard and typed values.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          defaults read com.apple.iphonesimulator ConnectHardwareKeyboard > native-ci/simulator-hardware-keyboard.log
          xcodebuild -version | tee native-ci/xcode-version.log
          python3 - <<'PY'
          import json, os, re, subprocess
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip().split('.')))
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          for runtime in sorted(devices, key=lambda name: tuple(map(int, re.findall(r'\d+', name))), reverse=True):
              if '.iOS-' not in runtime:
                  continue
              if tuple(map(int, re.findall(r'\d+', runtime)))[:2] > sdk[:2]:
                  continue
              candidates = [device for device in devices[runtime] if device['name'].startswith('iPhone') and device.get('deviceTypeIdentifier')]
              if candidates:
                  device = candidates[0]
                  simulator = subprocess.check_output(['xcrun', 'simctl', 'create', 'JAC CI', device['deviceTypeIdentifier'], runtime], text=True).strip()
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('JAC_CI_SIMULATOR_ID=' + simulator + '\n')
                  break
          else:
              raise SystemExit('No iPhone simulator runtime compatible with the selected Xcode SDK was found.')
          PY
      - name: Build and check the affected iPhone flows
        shell: bash
        env:
          JAC_CALENDAR_COMPILE: ${{ inputs.scope == 'calendar-compile' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-calendar-compile]')) }}
          JAC_REDESIGN: ${{ inputs.scope == 'redesign' || inputs.scope == 'redesign-followup' || inputs.scope == 'redesign-forms-ui-only' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-redesign]') || contains(github.event.head_commit.message, '[redesign-followup]') || contains(github.event.head_commit.message, '[redesign-forms-ui-only]'))) }}
          JAC_REDESIGN_FORMS_UI_ONLY: ${{ inputs.scope == 'redesign-forms-ui-only' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-forms-ui-only]')) }}
          JAC_REDESIGN_CRM_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-crm-only]') }}
          JAC_REDESIGN_FOLLOWUP: ${{ inputs.scope == 'redesign-followup' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[redesign-followup]')) }}
          JAC_WALLET_DETAILS: ${{ inputs.scope == 'wallet-details' || inputs.scope == 'wallet-details-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-wallet-details]')) }}
          JAC_WALLET_DETAILS_UI_ONLY: ${{ inputs.scope == 'wallet-details-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[wallet-ui-only]')) }}
          JAC_BOARDING_CARD: ${{ inputs.scope == 'boarding-card' || inputs.scope == 'boarding-card-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-boarding-card]')) }}
          JAC_BOARDING_CARD_UI_ONLY: ${{ inputs.scope == 'boarding-card-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[boarding-card-ui-only]')) }}
          JAC_APPLE_WALLET: ${{ inputs.scope == 'apple-wallet' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-apple-wallet]')) }}
          JAC_APPLE_PUSH: ${{ inputs.scope == 'apple-push' || inputs.scope == 'apple-push-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-apple-push]')) }}
          JAC_APPLE_PUSH_UI_ONLY: ${{ inputs.scope == 'apple-push-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[push-ui-only]')) }}
          JAC_PHOTO_PREVIEW: ${{ inputs.scope == 'photo-preview' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-photo-preview]')) }}
          JAC_PHOTO_NOTICES: ${{ inputs.scope == 'photo-notices' || inputs.scope == 'photo-notices-ipad' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[check-photo-notices]') || contains(github.event.head_commit.message, '[photo-notices-ipad-only]'))) }}
          JAC_PHOTO_NOTICES_IPAD_ONLY: ${{ inputs.scope == 'photo-notices-ipad' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[photo-notices-ipad-only]')) }}
          JAC_AUDIT: ${{ inputs.scope == 'audit' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-audit]')) }}
          JAC_LAYOUT_ONLY: ${{ inputs.scope == 'layout' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-layout]')) }}
          JAC_NAVIGATION_DRAWER_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-drawer-only]') }}
          JAC_NAVIGATION_STATE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-state-only]') }}
          JAC_NAVIGATION_AGENDA_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-agenda-only]') }}
          JAC_NAVIGATION_REMAINING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[navigation-remaining]') }}
          JAC_NAVIGATION: ${{ inputs.scope == 'navigation' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-navigation]')) }}
          JAC_MUSIC: ${{ inputs.scope == 'music' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-music]')) }}
          JAC_GALLERY_PREFETCH: ${{ inputs.scope == 'gallery-prefetch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-prefetch]')) }}
          JAC_GALLERY_PREFETCH_REMAINING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[prefetch-remaining]') }}
          JAC_MEDIA_LIGHT: ${{ inputs.scope == 'media-light' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-light]')) }}
          JAC_MEDIA_DELETE: ${{ inputs.scope == 'media-delete' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-media-delete]')) }}
          JAC_GALLERY_STABILITY: ${{ inputs.scope == 'gallery-stability' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-stability]')) }}
          JAC_GALLERY_STABILITY_UI_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gallery-ui-only]') }}
          JAC_GALLERY_UPDATE: ${{ inputs.scope == 'gallery-update' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-update]')) }}
          JAC_VIDEO_DETAIL_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-detail]') }}
          JAC_HD_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hd-only]') }}
          JAC_GALLERY_ONLY: ${{ inputs.scope == 'gallery-media' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-gallery-media]')) }}
          JAC_VIDEO_ONLY: ${{ inputs.scope == 'video-upload' || inputs.scope == 'video-quality' || inputs.scope == 'video-upload-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-upload]')) }}
          JAC_VIDEO_QUALITY_ONLY: ${{ inputs.scope == 'video-quality' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[quality-only]')) }}
          JAC_VIDEO_UI_ONLY: ${{ inputs.scope == 'video-upload-ui' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[check-video-upload]') && contains(github.event.head_commit.message, '[ui-only]')) }}
        run: |
          set -euo pipefail
          build_action=test
          if [ "$JAC_CALENDAR_COMPILE" = true ]; then
            checks=(
              -only-testing:JACNominaUITests/LaunchTests/testAgendaMonthUpcomingDetailsAndAccountRemainAccessible
              -only-testing:JACNominaUITests/LaunchTests/testAgendaDayEdgesSelectTheWholeVisibleCell
            )
          elif [ "$JAC_LAYOUT_ONLY" = true ]; then
            checks=()
            build_action=build-for-testing
          elif [ "$JAC_REDESIGN" = true ]; then
            # Reuse the real fixture-based journeys touched by the redesign.
            # No production accounts, passengers, notifications or payments.
            if [ "$JAC_REDESIGN_FORMS_UI_ONLY" = true ]; then
            # Production sources are unchanged: repeat only the two blocked
            # native forms after correcting measured XCTest AX coordinates.
            if [ "$JAC_REDESIGN_CRM_ONLY" = true ]; then
            checks=(-only-testing:JACNominaUITests/LaunchTests/testCRMCreateSingleDayShowFirstPaymentAndWeeklySummary)
            else
            checks=(
              -only-testing:JACNominaUITests/LaunchTests/testCreatePeriodAndManageItsActivitiesWithNativeForms
              -only-testing:JACNominaUITests/LaunchTests/testCRMCreateSingleDayShowFirstPaymentAndWeeklySummary
            )
            fi
            elif [ "$JAC_REDESIGN_FOLLOWUP" = true ]; then
            # Recheck the three failures and the two navigation journeys after
            # changing drawer layout. Reuse the earlier media/permission results.
            checks=(
              -only-testing:JACNominaUITests/LaunchTests/testAgendaMonthUpcomingDetailsAndAccountRemainAccessible
              -only-testing:JACNominaUITests/LaunchTests/testCreatePeriodAndManageItsActivitiesWithNativeForms
              -only-testing:JACNominaUITests/LaunchTests/testCRMCreateSingleDayShowFirstPaymentAndWeeklySummary
              -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarShowsAllModulesAndCanBeDismissed
              -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState
            )
            else
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testModernSectionsAreExactAndLegacyRestrictionsRemainDefensive
              -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarShowsAllModulesAndCanBeDismissed
              -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState
              -only-testing:JACNominaUITests/LaunchTests/testAgendaMonthUpcomingDetailsAndAccountRemainAccessible
              -only-testing:JACNominaUITests/LaunchTests/testMusicSectionsAndGlobalSearchRespectListeningPermission
              -only-testing:JACNominaUITests/LaunchTests/testMusicSectionSearchAndUploaderControls
              -only-testing:JACNominaUITests/LaunchTests/testBoardingCardShowsFlightDetailsBeforeOpeningTheOriginal
              -only-testing:JACNominaUITests/LaunchTests/testCRMCreateSingleDayShowFirstPaymentAndWeeklySummary
              -only-testing:JACNominaUITests/LaunchTests/testCreatePeriodAndManageItsActivitiesWithNativeForms
            )
            fi
          elif [ "$JAC_BOARDING_CARD" = true ]; then
            checks=(-only-testing:JACNominaUITests/LaunchTests/testBoardingCardShowsFlightDetailsBeforeOpeningTheOriginal)
            if [ "$JAC_BOARDING_CARD_UI_ONLY" != true ]; then
              checks+=(
                -only-testing:JACNominaTests/BoardingWalletDetailsTests/testBoardingCardUsesOneHourReminderAndMarksThePreviousDay
                -only-testing:JACNominaTests/BoardingWalletDetailsTests/testBoardingCardReadsClearPDFWithoutABarcodeAndKeepsWalletBoardingTime
                -only-testing:JACNominaTests/BoardingWalletDetailsTests/testBoardingCardDoesNotMixAmbiguousFlightsSeatsOrArrivalTimes
                -only-testing:JACNominaTests/BoardingWalletDetailsTests/testBoardingCardUsesOnlyASingleLegSeatWhenDocumentHasNoSeat
                -only-testing:JACNominaTests/BoardingWalletDetailsTests/testBoardingCardRejectsUnsupportedAndOversizedInput
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataCachesEachFileAndBoundsConcurrentReads
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataRevocationAndNewRevisionNeverRestoreOldValues
                -only-testing:JACNominaTests/PayrollClientTests/testBoardingCardMetadataDiscardsLateExtractionAfterLogout
              )
            fi
          elif [ "$JAC_PHOTO_NOTICES" = true ]; then
            if [ "$JAC_PHOTO_NOTICES_IPAD_ONLY" = true ]; then
              checks=(-only-testing:JACNominaUITests/IPadTests/testTabletMediaFolderNotificationOpensTheExactFolder)
              build_action=build-for-testing
            else
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testMediaFolderPushRoutesOnlyTheExactAuthorizedFolderAfterSessionRestoration
              -only-testing:JACNominaTests/PayrollClientTests/testMediaOnlyNotificationRegistrationDoesNotGrantNoticeFeedAccess
              -only-testing:JACNominaTests/PayrollClientTests/testMediaFolderPushRejectsRevokedDeletedAndMismatchedFolders
              -only-testing:JACNominaTests/PayrollClientTests/testMediaFolderPushDiscardsAResponseAfterTheSessionChanges
              -only-testing:JACNominaTests/PayrollClientTests/testNotificationPermissionIsRequestedAfterSessionAndDenialIsRespected
              -only-testing:JACNominaTests/PayrollClientTests/testNotificationsDisablePersistsAndLateTokenCannotRegisterUntilExplicitEnable
              -only-testing:JACNominaTests/PayrollClientTests/testSuspendedPushCannotRequestPermissionRegisterOrChangeUserPreference
              -only-testing:JACNominaTests/PayrollClientTests/testPushRoutingValidatesIdentifiersAndLogoutNamesOnlyThisDevice
              -only-testing:JACNominaUITests/LaunchTests/testMediaFolderNotificationOpensTheExactFolderForAMediaOnlyAccount
            )
            fi
          elif [ "$JAC_WALLET_DETAILS" = true ]; then
            if [ "$JAC_WALLET_DETAILS_UI_ONLY" = true ]; then
              checks=(-only-testing:JACNominaUITests/LaunchTests/testBoardingWalletMenuOpensEditableFlightDetailsWithoutShowingTheCode)
            else
            checks=(
              -only-testing:JACNominaTests/BoardingWalletDetailsTests
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletConfirmedDetailsKeepExplicitBlanksAndSelectedLeg
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletFlightFieldsValidateBeforeAnyNetworkRequest
              -only-testing:JACNominaTests/PayrollClientTests/testNativeNoticeRecipientsRefreshKeepsExplicitSelections
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletUsesPrivateNetworkContractAndRejectsWrongPackages
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletDenialAndChangedSessionRejectPrivatePass
              -only-testing:JACNominaUITests/LaunchTests/testBoardingWalletMenuOpensEditableFlightDetailsWithoutShowingTheCode
            )
            fi
          elif [ "$JAC_APPLE_WALLET" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletPreservesExactIATAPayloadAndOriginalCrop
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletRejectsUnsupportedOrLossyBarcodes
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletUsesPrivateNetworkContractAndRejectsWrongPackages
              -only-testing:JACNominaTests/PayrollClientTests/testBoardingWalletDenialAndChangedSessionRejectPrivatePass
            )
          elif [ "$JAC_APPLE_PUSH" = true ]; then
            if [ "$JAC_APPLE_PUSH_UI_ONLY" = true ]; then
              checks=(-only-testing:JACNominaUITests/LaunchTests/testSuspendedPushShowsStatusWithoutPermissionOrActivationControls)
            else
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testNotificationPermissionIsRequestedAfterSessionAndDenialIsRespected
              -only-testing:JACNominaTests/PayrollClientTests/testNotificationsDisablePersistsAndLateTokenCannotRegisterUntilExplicitEnable
              -only-testing:JACNominaTests/PayrollClientTests/testSuspendedPushCannotRequestPermissionRegisterOrChangeUserPreference
              -only-testing:JACNominaTests/PayrollClientTests/testPushRoutingValidatesIdentifiersAndLogoutNamesOnlyThisDevice
              -only-testing:JACNominaUITests/LaunchTests/testSuspendedPushShowsStatusWithoutPermissionOrActivationControls
              -only-testing:JACNominaUITests/LaunchTests/testNotificationPermissionAppearsAfterAuthenticatedStartupWithoutOpeningItineraries
            )
            fi
          elif [ "$JAC_PHOTO_PREVIEW" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testPendingPhotoPreviewRetriesOnlyTheLightVersionAndKeepsItsSession
              -only-testing:JACNominaTests/PayrollClientTests/testPhotoPreviewFailureIsReadableBoundedAndDoesNotBecomeAMissingThumbnail
              -only-testing:JACNominaTests/PayrollClientTests/testForbiddenPhotoPreviewNeverRetriesOrFallsBackToAnOriginal
              -only-testing:JACNominaTests/PayrollClientTests/testLightPhotoPreviewAndAdaptiveVideoNeverRequestOriginalBytes
              -only-testing:JACNominaTests/PayrollClientTests/testMissingThumbnailDoesNotInvalidateOtherImagesOrFolderSession
              -only-testing:JACNominaTests/PayrollClientTests/testIdenticalWorkspaceDoesNotRewriteEncryptedCopyAndOfflineSyncIsThrottled
              -only-testing:JACNominaTests/PayrollClientTests/testFullCopyRestoresBeforeNetworkAndOpensPayrollAgendaItineraryAndPrivatePassOffline
              -only-testing:JACNominaTests/MediaFullscreenPhotoModelTests
            )
          elif [ "$JAC_AUDIT" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testIdenticalWorkspaceDoesNotRewriteEncryptedCopyAndOfflineSyncIsThrottled
              -only-testing:JACNominaTests/PayrollClientTests/testFullCopyRestoresBeforeNetworkAndOpensPayrollAgendaItineraryAndPrivatePassOffline
              -only-testing:JACNominaTests/PayrollClientTests/testAlertImageAndExpenseReceiptDownloadAutomaticallyAndRemainReadableOffline
              -only-testing:JACNominaTests/PayrollClientTests/testFullOfflineCopyIsEncryptedSessionBoundAndRejectsTampering
              -only-testing:JACNominaTests/PayrollClientTests/testForbiddenPrivateAttachmentPurgesNoticeAndNeverReturnsCachedPDFOnline
              -only-testing:JACNominaTests/PayrollClientTests/testNativeWorkspaceAndActionsUseTheSameVersionedServerContract
              -only-testing:JACNominaTests/PayrollClientTests/testLightPhotoPreviewAndAdaptiveVideoNeverRequestOriginalBytes
              -only-testing:JACNominaTests/PayrollClientTests/testRevokedAgendaSessionAndForbiddenCalendarPurgeOfflineCopy
            )
          elif [ "$JAC_NAVIGATION" = true ]; then
            if [ "$JAC_NAVIGATION_STATE_ONLY" = true ]; then
              checks=(-only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState)
            elif [ "$JAC_NAVIGATION_DRAWER_ONLY" = true ]; then
              checks=(
                -only-testing:JACNominaTests/PayrollClientTests/testModernSectionsAreExactAndLegacyRestrictionsRemainDefensive
                -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarShowsAllModulesAndCanBeDismissed
                -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState
              )
            else
              checks=(
                -only-testing:JACNominaUITests/LaunchTests/testAlexAgendaDatesRemainUsableAfterSwitchingMenusAndBackground
              )
              if [ "$JAC_NAVIGATION_AGENDA_ONLY" != true ]; then
                checks+=(-only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarKeepsMusicAndNestedAccountState)
              fi
              if [ "$JAC_NAVIGATION_REMAINING" != true ]; then
                checks+=(
                  -only-testing:JACNominaUITests/LaunchTests/testPhoneSidebarShowsAllModulesAndCanBeDismissed
                  -only-testing:JACNominaUITests/LaunchTests/testEmptyProfileCanReachAccountAndLogOutThroughManagement
                  -only-testing:JACNominaUITests/LaunchTests/testModernHybridSectionsShowMediaAndItinerariesWithoutFinanceOrBoarding
                  -only-testing:JACNominaUITests/LaunchTests/testSidebarAndManagementKeepArchiveTeamAndAccountAccessible
                )
              fi
            fi
          elif [ "$JAC_MUSIC" = true ]; then
            checks=(
              -only-testing:JACNominaTests/PayrollClientTests/testMusicPermissionsDoNotGrantOtherSectionsAndUploadsRequireListening
              -only-testing:JACNominaTests/PayrollClientTests/testMusicPlaybackAuthorizationSurvivesLockAndIsRemovedWithSession
              -only-testing:JACNominaTests/PayrollClientTests/testMusicOfflineAudioIsEncryptedRevisionBoundAndCanBeDownloadedAgain
              -only-testing:JACNominaTests/PayrollClientTests/testMusicAlphabeticalSearchAndFileImportPreserveTheSource
              -only-testing:JACNominaTests/PayrollClientTests/testModernSectionsAreExactAndLegacyRestrictionsRemainDefensive
              -only-testing:JACNominaUITests/LaunchTests/testMusicSectionsAndGlobalSearchRespectListeningPermission
              -only-testing:JACNominaUITests/LaunchTests/testMusicSectionSearchAndUploaderControls
            )
          elif [ "$JAC_GALLERY_PREFETCH" = true ]; then
            if [ "$JAC_GALLERY_PREFETCH_REMAINING" = true ]; then
              checks=(
                -only-testing:JACNominaTests/MediaGridThumbnailLoaderTests/testReturningCellRestartsAfterCancellationAndUsesTheSameCachedPixels
                -only-testing:JACNominaUITests/LaunchTests/testPhotographyKeepsThumbnailsOrderAndPagesAcrossRefreshAndScrolling
              )
            else
            checks=(
              -only-testing:JACNominaTests/MediaGridThumbnailLoaderTests
              -only-testing:JACNominaTests/PayrollClientTests/testOpeningFolderPrefetchesOffscreenPhotosVideosAndLaterPagesWithoutOriginals
              -only-testing:JACNominaTests/PayrollClientTests/testDerivedThumbnailScopeStillRequiresUnlockedCurrentSession
              -only-testing:JACNominaTests/PayrollClientTests/testGalleryIndexMemoryTracksExternalWritesRemovalAndCorruption
              -only-testing:JACNominaTests/PayrollClientTests/testThumbnailCacheSurvivesClosingFolderMemoryEvictionAndReopeningSession
              -only-testing:JACNominaTests/PayrollClientTests/testThumbnailDiskCacheIsEncryptedBoundedByRevisionSessionAndExpiry
              -only-testing:JACNominaTests/PayrollClientTests/testMissingThumbnailDoesNotInvalidateOtherImagesOrFolderSession
              -only-testing:JACNominaTests/PayrollClientTests/testCacheNotificationsPreserveLoadedPagesAndOrderWhileApplyingExplicitDeletions
              -only-testing:JACNominaTests/PayrollClientTests/testCachedGalleryIncludesDeletionMarkersForVisibleAndPinnedFolders
              -only-testing:JACNominaTests/PayrollClientTests/testMediaFolderPaginationRecursionOfflineReopenAndRevocation
              -only-testing:JACNominaTests/PayrollClientTests/testMusicOfflineAudioIsEncryptedRevisionBoundAndCanBeDownloadedAgain
