name: JAC web and API checks
on:
  push:
    branches: [main]
    paths: ['app/**', 'lib/**', 'db/**', 'drizzle/**', 'public/**', 'worker/**', 'tests/**', 'scripts/*.mjs', 'package*.json', 'vite.config.*', 'deploy/cloudflare/**', '.github/workflows/web-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jac-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    if: ${{ github.event.repository.private == false && !contains(github.event.head_commit.message, '[web-verified-locally]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install FFmpeg for synthetic audio fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - name: Run affected Node checks
        shell: bash
        env:
          JAC_SLACK_BOARDING_WEB_FOLLOWUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[slack-boarding-web-followup]') }}
        run: |
          set -euo pipefail
          if [ "$JAC_SLACK_BOARDING_WEB_FOLLOWUP" = true ]; then
            node --test tests/audit-corrections.test.mjs tests/audit-maintenance.test.mjs tests/media-access.test.mjs tests/music.test.mjs tests/payroll-navigation.test.mjs
          else
            node scripts/affected-tests.mjs
          fi
